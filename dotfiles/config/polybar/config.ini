[colors]
bg = #282828
bg-alt = #3c3836
fg = #ebdbb2
nord-blue = #81a1c1
nord-cyan = #88c0d0
gruvbox-yellow = #fabd2f
gruvbox-green = #b8bb26
gruvbox-red = #fb4934

[bar/main]
width = 100%
height = 30
radius = 0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
border-size = 4
border-color = #00000000

padding-left = 1
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10:weight=bold;2"

modules-left = bspwm
modules-center = date
modules-right = dashboard-btn pulseaudio memory cpu

cursor-click = pointer

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = ${colors.nord-blue}
label-focused-foreground = ${colors.bg}
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = #7c6f64
label-empty-padding = 2

[module/dashboard-btn]
type = custom/text
content = " 󰕮 Dashboard "
content-background = ${colors.bg-alt}
content-foreground = ${colors.nord-cyan}
click-left = eww open --toggle dashboard

[module/date]
type = internal/date
interval = 1
date = %d.%m.%Y
time = %H:%M
label = 󰥔 %time% | %date%
label-foreground = ${colors.nord-blue}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = 󰕾 <label-volume>
label-volume = %percentage%%
label-muted = 󰖁 muted
label-muted-foreground = ${colors.gruvbox-red}

[module/memory]
type = internal/memory
interval = 2
label = 󰍛 %percentage_used%%
label-foreground = ${colors.gruvbox-yellow}

[module/cpu]
type = internal/cpu
interval = 2
label = 󰻠 %percentage%%
label-foreground = ${colors.gruvbox-green}
